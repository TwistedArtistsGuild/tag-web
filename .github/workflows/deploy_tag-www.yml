name: Build and deploy Node.js app to Azure Web App - tag-www

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build Next.js standalone app
        run: |
          npm ci
          npm run build
          
          # Prepare standalone directory structure
          mkdir -p .next/standalone/.next
          
          # Copy static assets and public directory to standalone structure
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          
          # Copy server files and manifests
          cp -r .next/server .next/standalone/.next/
          cp .next/BUILD_ID .next/standalone/.next/
          cp .next/prerender-manifest.json .next/standalone/.next/ 2>/dev/null || true
          cp .next/routes-manifest.json .next/standalone/.next/ 2>/dev/null || true

      - name: Create standalone deployment zip
        run: |
          cd .next/standalone
          # Zip all contents (including hidden folders like .next) directly into deploy.zip
          zip -r ../../deploy.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B892DAAB85314738B4ACB9D950FAA5EC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5C31CF05540456B82E59E2EE787B792 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9348795B52E472E8290A84B114DA478 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tag-www'
          slot-name: 'Production'
          package: 'deploy.zip'
          type: zip